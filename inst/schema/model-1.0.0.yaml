dialect: form.model/schema/1
contract_version: 1.0.0
root: model
definitions:
  text:
    type: string
    min_length: 1
  id:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
  version:
    ref: text
  boolean:
    type: boolean
  number:
    type: number
  positive:
    type: integer
    minimum: 1
  count:
    type: integer
    minimum: 0
  type:
    type: string
    enum:
    - string
    - email
    - integer
    - number
    - latitude
    - longitude
    - boolean
    - date
    - datetime
  form:
    type: mapping
    required:
    - id
    - version
    properties:
      id:
        ref: id
      version:
        ref: version
  reference_use:
    shorthand: {ref: id}
    type: mapping
    required:
    - id
    properties:
      id:
        ref: id
      severity:
        type: string
        enum:
        - error
        - warning
  registry_use:
    type: mapping
    required:
    - id
    - column
    properties:
      id:
        ref: id
      column:
        ref: id
      matching:
        type: string
        enum:
        - exact
        - name
      severity:
        type: string
        enum:
        - error
        - warning
  sequence_rule:
    type: mapping
    required: [start, group_by]
    properties:
      start:
        type: integer
      group_by:
        type: sequence
        items:
          ref: id
        min_items: 1
  field:
    type: mapping
    required:
    - type
    properties:
      mandatory:
        ref: boolean
      location:
        type: string
        pattern: ^[A-Z]+[1-9][0-9]*$
      type:
        ref: type
      required_field:
        ref: id
      enum:
        type: sequence
        items:
          type: scalar
        min_items: 1
      minimum:
        ref: number
      maximum:
        ref: number
      maximum_field:
        ref: id
      sequence:
        ref: sequence_rule
      pattern:
        ref: text
      unique:
        ref: boolean
      reference:
        ref: reference_use
      code_list:
        ref: reference_use
      registry:
        ref: registry_use
  fields:
    type: mapping
    key_pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
    values:
      ref: field
    min_items: 0
  layout:
    type: mapping
    required:
    - kind
    properties:
      kind:
        type: string
        enum:
        - cells
        - table
      start_row:
        ref: positive
      column_count:
        ref: count
      row_count:
        ref: count
  parent_key:
    type: mapping
    required: [sheet, fields]
    properties:
      sheet:
        ref: id
      fields:
        type: sequence
        items:
          ref: id
        min_items: 1
  sheet:
    type: mapping
    required:
    - layout
    - fields
    properties:
      layout:
        ref: layout
      parent_key:
        ref: parent_key
      primary_key:
        type: sequence
        items:
          ref: id
        min_items: 1
      fields:
        ref: fields
  sheets:
    type: mapping
    key_pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
    values:
      ref: sheet
    min_items: 1
  reference_ids:
    type: sequence
    items:
      ref: id
    min_items: 0
  references:
    shorthand: {ref: reference_ids}
    type: mapping
    properties:
      code_lists:
        ref: reference_ids
      registries:
        ref: reference_ids
  model:
    type: mapping
    required:
    - schema_version
    - form
    - references
    - sheets
    properties:
      schema_version:
        type: string
        enum:
        - 1.0.0
      form:
        ref: form
      references:
        ref: references
      sheets:
        ref: sheets
